<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f13;--sidebar:#17171c;--card:#1c1c22;--border:#2a2a32;--text:#e8e8ec;--muted:#8a8a96;--accent:#7c5cff;--accent2:#00d4ff}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:280px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform.3s}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.new-chat{margin:16px;padding:12px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);cursor:pointer;font-size:14px;transition:.2s}
.new-chat:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.history{flex:1;overflow-y:auto;padding:0 12px}
.hist-item{padding:12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;transition:.2s;animation:slideIn.3s}
.hist-item:hover{background:var(--card);color:var(--text)}
.hist-item.active{background:var(--card);color:var(--text);border-left:3px solid var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.main{flex:1;display:flex;flex-direction:column;position:relative}
.chat{flex:1;overflow-y:auto;padding:40px 20px;max-width:800px;margin:0 auto;width:100%}
.welcome{text-align:center;margin-top:80px;animation:fadeUp.6s}
.welcome h1{font-size:42px;margin-bottom:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--muted);font-size:16px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.msg{margin:20px 0;display:flex;gap:14px;animation:fadeUp.4s}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.user.avatar{background:linear-gradient(135deg,#667eea,#764ba2)}
.ai.avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.bubble{max-width:80%;padding:14px 18px;border-radius:16px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.user{justify-content:flex-end}
.user.bubble{background:var(--accent);color:white;border-bottom-right-radius:4px}
.ai.bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.typing{display:flex;gap:6px;padding:18px}
.typing span{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.2)}}
.input-area{padding:20px;max-width:800px;margin:0 auto;width:100%}
.input-box{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 8px 8px 20px;align-items:center;transition:.2s}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 20px rgba(124,92,255,.2)}
input{flex:1;background:transparent;border:none;color:var(--text);font-size:15px;outline:none;padding:12px 0}
button.send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:18px;cursor:pointer;transition:.2s}
button.send:hover{transform:scale(1.1) rotate(10deg)}
button.send:disabled{opacity:.5;transform:none}
@media(max-width:768px){.sidebar{position:fixed;z-index:10;height:100%;transform:translateX(-100%)}.sidebar.open{transform:none}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div class="sidebar-header"><div class="logo">⚡ Nexus AI</div></div>
<button class="new-chat" onclick="newChat()">+ Nova conversa</button>
<div class="history" id="history"></div>
</div>
<div class="main">
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<h1>Olá, eu sou a Nexus</h1>
<p>Pergunte qualquer coisa. Rápida, grátis e sem limites chatos.</p>
</div>
</div>
<div class="input-area">
<div class="input-box">
<input id="inp" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')send()">
<button class="send" id="btn" onclick="send()">➤</button>
</div>
</div>
</div>
<script>
let chats = JSON.parse(localStorage.getItem('nexus_chats')||'{}');
let currentId = localStorage.getItem('nexus_current')||null;
let messages = [];

function save(){ localStorage.setItem('nexus_chats', JSON.stringify(chats)); localStorage.setItem('nexus_current', currentId); }
function newChat(){ currentId = 'c'+Date.now(); messages=[]; chats[currentId]={title:'Nova conversa',msgs:[]}; save(); render(); renderHistory(); }
function renderHistory(){
  const h=document.getElementById('history'); h.innerHTML='';
  Object.keys(chats).reverse().forEach(id=>{
    const d=document.createElement('div');
    d.className='hist-item'+(id===currentId?' active':'');
    d.textContent=chats[id].title;
    d.onclick=()=>{currentId=id; messages=chats[id].msgs; save(); render(); renderHistory();};
    h.appendChild(d);
  });
}
function render(){
  const c=document.getElementById('chat'); c.innerHTML='';
  if(messages.length===0){ c.innerHTML='<div class="welcome"><h1>Olá, eu sou a Nexus</h1><p>Pergunte qualquer coisa. Rápida, grátis e sem limites chatos.</p></div>'; return; }
  messages.forEach(m=>{
    const div=document.createElement('div'); div.className='msg '+m.role;
    div.innerHTML=`<div class="avatar">${m.role==='user'?'🧑':'🤖'}</div><div class="bubble">${m.text}</div>`;
    c.appendChild(div);
  });
  c.scrollTop=c.scrollHeight;
}
async function send(){
  const inp=document.getElementById('inp'); const btn=document.getElementById('btn');
  const txt=inp.value.trim(); if(!txt) return;
  if(!currentId) newChat();
  document.getElementById('welcome')?.remove();
  messages.push({role:'user',text:txt});
  if(messages.length===1) chats[currentId].title = txt.slice(0,35);
  inp.value=''; btn.disabled=true; render(); renderHistory();
  const c=document.getElementById('chat');
  const t=document.createElement('div'); t.className='msg ai';
  t.innerHTML='<div class="avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>';
  c.appendChild(t); c.scrollTop=c.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:txt})});
    const d=await r.json();
    t.remove();
    const resp=d.resposta||('Erro: '+d.error);
    messages.push({role:'ai',text:''});
    chats[currentId].msgs=messages; save();
    const div=document.createElement('div'); div.className='msg ai';
    div.innerHTML='<div class="avatar">🤖</div><div class="bubble"></div>';
    c.appendChild(div);
    const bub=div.querySelector('.bubble');
    let i=0;
    const iv=setInterval(()=>{ bub.textContent=resp.slice(0,i+=3); c.scrollTop=c.scrollHeight; if(i>=resp.length) clearInterval(iv); },10);
    messages[messages.length-1].text=resp;
    chats[currentId].msgs=messages; save(); renderHistory();
  }catch(e){ t.remove(); messages.push({role:'ai',text:'Erro de conexão'}); render(); }
  btn.disabled=false;
}
if(!currentId) newChat(); else { messages=chats[currentId]?.msgs||[]; render(); }
renderHistory();
</script>
</body>
</html>
